# The static app (G-0018). Only the production context gets the backend's address (G-0019):
# set BACKEND_URL in the host's settings, scoped to production only; vite.config.ts ignores
# it in every other context anyway.

[build]
  command = "pnpm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Single-page app: unknown paths serve the app shell (real files win).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The content security policy and the other security headers for every path are not here:
# the build writes them to dist/_headers (src/headers.ts, vite.config.ts), so a production
# build can allow the backend's origin without its address being in the repository.

# The service worker and its manifest must never be cached, or updates get stuck.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
