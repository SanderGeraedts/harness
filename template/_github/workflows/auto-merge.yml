# Every green pull request that isn't a draft merges itself (G-0011), through the harness's
# reusable workflow. Keep the ref the same as the harness dependency in package.json (G-0004).
#
# GitHub runs workflow_run workflows from the default branch, so a pull request can't change
# how its own merge is decided.
name: Auto-merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge:
    uses: SanderGeraedts/harness/.github/workflows/auto-merge.yml@__HARNESS_REF__
