# Reusable: spin-up of a project's hosting and backend (G-0028). Built in T-0004 (0.7.0);
# until then it only says so, so that the `project-up.yml` that `harness infra init`
# generates is a valid caller from the start. It runs on GitHub's runner and touches nothing.
name: Infrastructure project up (reusable)

on:
  workflow_call:
    inputs:
      environment:
        type: string
        default: Prod
      harness-ref:
        type: string
        required: true
      project:
        type: string
        required: true
      repository:
        type: string
        required: true
      sync:
        type: boolean
        default: false
      funnel-paths:
        type: string
        default: "[]"
      installation-id:
        type: string
        default: ""
      request-id:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  up:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          echo "::error::Spin-up arrives with harness 0.7.0 (T-0004). Nothing was done."
          exit 1
