# The harness's own CI (G-0015): the unit tests, then the self-test, which packs the
# harness, installs it into a throwaway project and runs its commands there. It goes
# through the reusable CI workflow, so that is tested too. The auto-merge workflow starts it
# on main after a merge (workflow_dispatch): a merge made with GITHUB_TOKEN starts no push
# workflows.
name: Harness CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      harness: node bin/harness.mjs
      checks: |
        pnpm test
        pnpm run self-test --keep-on-failure
      # The throwaway projects of a failed self-test, to see what went wrong.
      artifacts: |
        /tmp/harness-self-test-*/
        !/tmp/harness-self-test-*/*/node_modules/
      artifact-name: self-test-project
      artifacts-only-on-failure: true

  # The template's end-to-end tests: the self-test once more with --e2e, which also runs
  # Playwright in the two projects `harness create` makes, with and without sync. The one
  # that syncs builds its backend image and starts it as a throwaway backend (Docker), for
  # the tests of the sign-in and sync. Its own job, so the checks stay quick.
  template-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The created project installs its browser into this cache (see ci.yml on --with-deps).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('template/pnpm-lock.yaml') }}
      - run: node scripts/self-test.mjs --e2e

  # The template's backend (G-0019): the project `harness create --sync` makes, through the
  # reusable backend workflow a project calls. That builds its image, starts it on an empty
  # database, and runs its smoke test and the app's backend tests against it. Never
  # published: it is nobody's backend.
  template-backend:
    uses: ./.github/workflows/backend.yml
    with:
      setup: node scripts/make-project.mjs /tmp/harness-template-backend/spun-up --sync
      project-directory: /tmp/harness-template-backend/spun-up
      publish: false
